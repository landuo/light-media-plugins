name: Publish plugin build

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-plugin-build
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly
  GOAUTH: 'off'
  GOPRIVATE: ''
  GOOS: linux
  GOARCH: amd64
  CGO_ENABLED: '0'

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.4'
          check-latest: false
          cache: false
      - name: Build and publish the current main
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            git fetch --depth=1 origin main
            sha="$(git rev-parse origin/main)"
            git checkout --force "$sha"
            rm -rf "$RUNNER_TEMP/dist"
            python3 scripts/build_plugins.py \
              --output "$RUNNER_TEMP/dist" \
              --release-base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/build-${sha}"
            if output="$(GITHUB_SHA="$sha" python3 scripts/publish_release.py \
                --dist "$RUNNER_TEMP/dist" \
                --repo "$GITHUB_REPOSITORY" \
                --source-sha "$sha" 2>&1)"; then
              printf '%s\n' "$output"
              echo "published ${sha}"
              exit 0
            fi
            printf '%s\n' "$output"
            if ! grep -q 'main source changed' <<<"$output"; then
              exit 1
            fi
            echo "main advanced during attempt ${attempt}; rebuilding the new head"
          done
          echo "main kept advancing; dispatch again once it is stable" >&2
          exit 1
