name: Go plugin source catalog

on:
  push:
    branches: [main]
    paths-ignore: [go-plugins.v2.json]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-catalog-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly
  GOAUTH: 'off'
  GOPRIVATE: ''
  GOOS: linux
  GOARCH: amd64

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.4'
          check-latest: false
          cache: false
      - name: Vet and test pull requests
        if: github.event_name == 'pull_request'
        env:
          CGO_ENABLED: '1'
        run: |
          test "$(uname -m)" = x86_64
          go vet ./...
          go test -race ./...
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Verify Linux amd64 workers compile
        run: go build -trimpath -buildvcs=false ./cmd/...
      - name: Verify Linux arm64 workers compile
        env:
          GOARCH: arm64
        run: go build -trimpath -buildvcs=false ./cmd/...

  catalog:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.4'
          check-latest: false
          cache: false
      - name: Generate catalog from actual worker manifests
        run: python3 scripts/build_source_catalog.py --source-sha "$GITHUB_SHA"
      - name: Publish only the catalog
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --quiet HEAD -- . ':!go-plugins.v2.json'
          git add -- go-plugins.v2.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "chore: publish plugin source catalog for $GITHUB_SHA [skip ci]"
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git push origin HEAD:refs/heads/main
